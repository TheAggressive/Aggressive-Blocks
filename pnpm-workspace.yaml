packages: []

allowBuilds:
  '@parcel/watcher': true
  core-js: false
  core-js-pure: false
  fs-ext-extra-prebuilt: false
  unrs-resolver: false

# Security floors for development tooling that pins vulnerable versions:
# copy-webpack-plugin 10 (via @wordpress/scripts) wants serialize-javascript ^6
# (GHSA-5c6j-r48x-rmvq, GHSA-qj8w-gfj5-8c6v); sockjs and @wordpress/components
# want uuid 8 and 9 (GHSA-w5hq-g745-h8pq); and express 4.22.2 (via
# @wordpress/env's Playground CLI) caps qs at ~6.15 (GHSA-4mjr-xmp4-gh2g,
# GHSA-x5fp-wj9c-mxmx); and markdownlint-cli 0.49 (via @wordpress/scripts)
# pins js-yaml ~5.2.1 (GHSA-r3ph-w7gj-g6xm) and smol-toml ~1.7.0
# (GHSA-r4xh-jqrq-34v2); cssnano 6 and @stylistic/stylelint-plugin want
# postcss-selector-parser 6, whose only fix is 7.1.6 (GHSA-rj75-hqrm-r3gf); 7.0
# changed nothing but insertion during iteration, and the build output is
# byte-identical with it; css-tree holds source-map-js at 1.2.1
# (GHSA-68fv-2mgg-jv7q); and micromark-extension-math (via markdownlint) wants
# katex 0.16 (GHSA-238p-pmpm-9mq7), which only its HTML renderer loads and
# markdownlint never calls. Each patched version keeps the CommonJS entry and
# API those callers use, except simple-git (below). Remove an entry once no
# dependency resolves below it.
# Preset 10 uses writer 9 template helpers; semantic-release 25's notes plugin
# still requests writer 8 (semantic-release/release-notes-generator#1027).
# Its writeChangelogString API is unchanged. Remove this scoped override when
# the notes plugin itself requires writer 9. The release-rules test renders
# the installed project preset through that plugin to guard this pairing.
overrides:
  '@semantic-release/release-notes-generator>conventional-changelog-writer': ^9.3.0
  'serialize-javascript@<7.0.5': ^7.0.5
  'uuid@<11.1.1': ^11.1.1
  'qs@<6.16.0': ^6.16.0
  'js-yaml@>=5.0.0 <5.4.1': ^5.4.1
  'smol-toml@<1.8.1': ^1.8.1
  'postcss-selector-parser@<7.1.6': ^7.1.6
  'source-map-js@<1.2.2': ^1.2.2
  'katex@<0.18.2': ^0.18.2
  'simple-git@<4.0.1': ^4.0.2

# @wordpress/env 11.17 wants simple-git ^3, which has no fix for
# GHSA-v5rq-49vh-5v5c, GHSA-x6jw-m9v5-85vh, GHSA-858h-whjf-mvg5 or
# GHSA-g4wm-2vf7-vfgr. simple-git 4 drops the callable default export that
# wp-env requires, so this patch carries WordPress/gutenberg#84137, the upstream
# change that moves wp-env to the named `simpleGit` export, verbatim. It is
# pinned to 11.17.0, and allowUnusedPatches lets a later @wordpress/env install
# without it; bin/ci/contracts/wp-env.mjs fails if that version still calls the
# default export. Delete the patch and the simple-git override once
# @wordpress/env requires simple-git 4 itself.
# The same patch pins the PHP 8.2 coverage environment's Xdebug to the official
# 3.5.3 archive, checks its SHA-256, and installs it offline. PECL REST metadata
# failures otherwise prevent tests from starting. Remove this part once wp-env
# provides a pinned, verified installation without a PECL metadata dependency.
# bin/wp-env/xdebug.test.mjs exercises the generated Dockerfiles and installer.
allowUnusedPatches: true

# No fixed npm releases exist for GHSA-vfj7-8cjw-p6xm or GHSA-hp3w-g68c-fv3c.
# Bound AST nesting and formatting allocations locally until upstream ships.
# bin/dependency-patches.test.mjs exercises the installed patched packages.
patchedDependencies:
  'braces@3.0.3': patches/braces@3.0.3.patch
  'sprintf-js@1.0.3': patches/sprintf-js@1.0.3.patch
  '@wordpress/env@11.17.0': patches/@wordpress__env@11.17.0.patch
