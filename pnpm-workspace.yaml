packages: []

allowBuilds:
  '@parcel/watcher': true
  core-js: false
  core-js-pure: false
  fs-ext-extra-prebuilt: false
  unrs-resolver: false

# Security floors for development tooling that pins vulnerable versions:
# copy-webpack-plugin 10 (via @wordpress/scripts) wants serialize-javascript ^6
# (GHSA-5c6j-r48x-rmvq, GHSA-qj8w-gfj5-8c6v); sockjs and @wordpress/components
# want uuid 8 and 9 (GHSA-w5hq-g745-h8pq); and express 4.22.2 (via
# @wordpress/env's Playground CLI) caps qs at ~6.15 (GHSA-4mjr-xmp4-gh2g,
# GHSA-x5fp-wj9c-mxmx); and markdownlint-cli 0.49 (via @wordpress/scripts)
# pins js-yaml ~5.2.1 (GHSA-r3ph-w7gj-g6xm) and smol-toml ~1.7.0
# (GHSA-r4xh-jqrq-34v2); cssnano 6 and @stylistic/stylelint-plugin want
# postcss-selector-parser 6, whose only fix is 7.1.6 (GHSA-rj75-hqrm-r3gf); 7.0
# changed nothing but insertion during iteration, and the build output is
# byte-identical with it; css-tree holds source-map-js at 1.2.1
# (GHSA-68fv-2mgg-jv7q); and micromark-extension-math (via markdownlint) wants
# katex 0.16 (GHSA-238p-pmpm-9mq7), which only its HTML renderer loads and
# markdownlint never calls. Each patched version keeps the CommonJS entry and
# API those callers use. Remove an entry once no dependency resolves below it.
overrides:
  'serialize-javascript@<7.0.5': ^7.0.5
  'uuid@<11.1.1': ^11.1.1
  'qs@<6.16.0': ^6.16.0
  'js-yaml@>=5.0.0 <5.4.1': ^5.4.1
  'smol-toml@<1.8.1': ^1.8.1
  'postcss-selector-parser@<7.1.6': ^7.1.6
  'source-map-js@<1.2.2': ^1.2.2
  'katex@<0.18.2': ^0.18.2
