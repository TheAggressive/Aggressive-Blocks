name: Visual Regression

# Screenshots of canonical block states against committed baselines
# (tests/visual). Not yet a merge gate: the baselines were made on Ubuntu
# 24.04 outside Actions. Once this runs green on the runners, move the job
# into ci.yml under the CI Summary. If the runners render differently, run
# this workflow with "update" to regenerate the baselines on a runner, then
# review and commit the uploaded images. See docs/ci.md.
on:
  pull_request:
    paths:
      - .github/workflows/visual-regression.yml
      - bin/ci/visual.sh
      - bin/ci/lib/native-wp.sh
      - playwright.visual.config.ts
      - tests/visual/**
      - src/**
      - package.json
      - pnpm-lock.yaml
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      update:
        description: Regenerate the baselines on the runner and upload them
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: visual-regression-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.18.0'
  PHP_VERSION: '8.2.32'

jobs:
  visual:
    name: 🖼️ Visual Regression
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    services:
      mysql:
        image: mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 127.0.0.1:3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      AB_WP_DB_HOST: 127.0.0.1:3306
      AB_WP_DB_USER: root
      AB_WP_DB_PASSWORD: root

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: none

      - name: Cache Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and package the plugin
        run: |
          pnpm ci:build
          pnpm ci:package

      - name: Install Playwright browser
        run: pnpm test:e2e:install

      - name: Compare screenshots
        env:
          AB_VISUAL_UPDATE: ${{ inputs.update && '1' || '' }}
        run: pnpm ci:visual

      - name: Upload regenerated baselines
        if: ${{ inputs.update }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-baselines
          path: tests/visual/blocks.spec.ts-snapshots/
          retention-days: 7

      - name: Upload screenshot diffs
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-regression-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
