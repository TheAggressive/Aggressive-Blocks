name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Cut a release from main if the merged commits warrant one'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '24.18.0'

jobs:
  changes:
    name: 🧭 Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      code: ${{ steps.decide.outputs.code }}
      docs_only: ${{ steps.decide.outputs.docs_only }}
      version_sync: ${{ steps.decide.outputs.version_sync }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          list-files: json
          filters: |
            all:
              - '**'

      - name: Decide which lanes are required
        id: decide
        env:
          IS_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
          CHANGED_FILES: ${{ steps.filter.outputs.all_files }}
          HEAD_REF: ${{ github.head_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: node bin/ci/classify-changes.mjs

  release-plan:
    name: 🧮 Plan Release
    runs-on: ubuntu-24.04
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.publish &&
      github.ref == 'refs/heads/main'
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      release_type: ${{ steps.check.outputs.release_type }}
      next_version: ${{ steps.check.outputs.next_version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install release tooling
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Determine release
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: '0'
        run: node bin/release/plan.mjs

  lint-frontend:
    name: 🔍 Lint & Test Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    needs: changes
    if: >-
      needs.changes.outputs.code == 'true' &&
      needs.changes.outputs.version_sync != 'true'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install gettext for PO validator tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends gettext

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run canonical frontend lane
        run: pnpm ci:frontend

  dependency-review:
    name: 🛡️ Dependency Review
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  i18n:
    name: 🌐 i18n Check
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.version_sync != 'true'
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run canonical i18n lane
        run: pnpm ci:i18n

  build:
    name: 🔨 Build
    runs-on: ubuntu-24.04
    needs: [lint-frontend, i18n]
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run canonical build lane
        run: pnpm ci:build

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-artifacts
          path: build/
          retention-days: 7

  test:
    name: 🧪 PHP Quality & Tests
    runs-on: ubuntu-24.04
    needs: [build]
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-artifacts
          path: build/

      - name: Run canonical PHP lane
        run: pnpm ci:php

  e2e:
    name: 🎭 Browser E2E
    runs-on: ubuntu-24.04
    needs: [build]
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Cache Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-artifacts
          path: build/

      - name: Install Playwright browser
        run: pnpm test:e2e:install

      - name: Run end-to-end tests
        run: pnpm ci:e2e

      - name: Upload Playwright report
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  package:
    name: 📦 Package Plugin
    runs-on: ubuntu-24.04
    needs: [build, test, e2e]
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-artifacts
          path: build/

      - name: Run canonical package lane
        env:
          AA_RELEASE_VERSION: ${{ needs.release-plan.outputs.next_version }}
        run: pnpm ci:package

      - name: Upload plugin package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-package
          path: |
            aggressive-blocks*.zip
            aggressive-blocks*.zip.sha256
          retention-days: 30

  artifact-acceptance:
    name: 🧳 Release Artifact Acceptance
    runs-on: ubuntu-24.04
    needs: [package]
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Cache Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download plugin package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plugin-package
          path: ./

      - name: Install Playwright browser
        run: pnpm test:e2e:install

      - name: Run canonical artifact acceptance lane
        env:
          AA_RELEASE_VERSION: ${{ needs.release-plan.outputs.next_version }}
        run: pnpm ci:artifact

      - name: Upload artifact-smoke diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifact-smoke-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  release:
    name: 🚀 Release
    runs-on: ubuntu-24.04
    needs: [release-plan, package, artifact-acceptance]
    if: success() && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    timeout-minutes: 15
    environment: production
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # zizmor: ignore[artipacked] semantic-release needs this credential
          # to push the verified release tag from this publishing-only job.
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install release tooling
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download plugin package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plugin-package
          path: ./

      - name: Publish GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: '0'
        run: node bin/release/publish.mjs

  summary:
    name: CI Summary
    runs-on: ubuntu-24.04
    if: always()
    needs:
      - changes
      - release-plan
      - dependency-review
      - lint-frontend
      - i18n
      - build
      - test
      - e2e
      - package
      - artifact-acceptance
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Aggregate required gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
          SHOULD_RELEASE: ${{ needs.release-plan.outputs.should_release }}
          NEXT_VERSION: ${{ needs.release-plan.outputs.next_version }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          RELEASE_PLAN_RESULT: ${{ needs.release-plan.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          FRONTEND_RESULT: ${{ needs.lint-frontend.result }}
          I18N_RESULT: ${{ needs.i18n.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          PHP_RESULT: ${{ needs.test.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          ARTIFACT_ACCEPTANCE_RESULT: ${{ needs.artifact-acceptance.result }}
          RELEASE_RESULT: skipped
          VERSION_SYNC_RESULT: skipped
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          VERSION_SYNC: ${{ needs.changes.outputs.version_sync }}
          PUBLISH_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.publish || false }}
        run: node bin/ci/release-summary.mjs
