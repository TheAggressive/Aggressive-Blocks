name: Release Recovery

# Rebuild the plugin ZIP for an existing release tag and re-attach it to that
# release, e.g. after an asset was deleted or an upload failed. The rebuilt ZIP
# passes the same package verification and artifact acceptance as a normal
# release before the write-capable job touches the release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to rebuild and re-attach (e.g. v1.2.3)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-recovery-${{ inputs.tag }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24.18.0'

jobs:
  rebuild:
    name: Rebuild and verify release artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Resolve release version from tag
        id: version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "${TAG}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?)$ ]]; then
            echo "'${TAG}' is not a release tag like v1.2.3." >&2
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}" >>"${GITHUB_OUTPUT}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Cache Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild and verify package
        env:
          AA_RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          pnpm ci:build
          pnpm ci:package

      - name: Install Playwright browser
        run: pnpm test:e2e:install

      - name: Run artifact acceptance lane
        env:
          AA_RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: pnpm ci:artifact

      - name: Upload recovered package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: recovered-plugin-package
          path: |
            aggressive-blocks-${{ steps.version.outputs.version }}.zip
            aggressive-blocks-${{ steps.version.outputs.version }}.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload artifact-smoke diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: recovery-artifact-smoke-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  attach:
    name: Re-attach to release
    runs-on: ubuntu-24.04
    needs: rebuild
    timeout-minutes: 5
    environment: production
    permissions:
      contents: write

    steps:
      - name: Download recovered package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: recovered-plugin-package
          path: ./

      - name: Replace release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ needs.rebuild.outputs.version }}
        run: |
          set -euo pipefail
          zip="aggressive-blocks-${VERSION}.zip"
          sha256sum --check "${zip}.sha256"
          gh release upload "${TAG}" "${zip}" "${zip}.sha256" \
            --clobber --repo "${GITHUB_REPOSITORY}"
