name: Release Recovery

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to rebuild and re-attach'
        required: true
        type: string

permissions:
  contents: read

jobs:
  recover:
    name: Rebuild release artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild and verify package
        env:
          AA_RELEASE_VERSION: ${{ inputs.tag }}
        run: |
          pnpm ci:build
          pnpm ci:package

      - name: Upload recovered package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: recovered-plugin-package
          path: aggressive-blocks*.zip
          retention-days: 30
